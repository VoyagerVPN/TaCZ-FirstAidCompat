plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
layout.buildDirectory = layout.projectDirectory.dir('.cache/build')

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

jarJar.enable()

mixin {
    add sourceSets.main, 'tacz_firstaid_compat.refmap.json'
    config 'tacz_firstaid_compat.mixins.json'
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"
    
    runs {
        configureEach {
            workingDirectory project.file('.cache/run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            
            mods {
                tacz_firstaid_compat {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'tacz_firstaid_compat'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'tacz_firstaid_compat'
            args '--nokogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                tacz_firstaid_compat {
                    source sourceSets.test
                }
            }
        }
    }
}

repositories {
    flatDir { dirs '.cache/deps' }
    mavenCentral()
    maven {
        url 'https://repo.spongepowered.org/repository/maven-public'
        content { includeGroup 'org.spongepowered' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    
    annotationProcessor variantOf(libs.org.spongepowered.mixin) { classifier 'processor' }
    
    // MixinExtras
    implementation "io.github.llamalad7:mixinextras-forge:0.5.0"
    jarJar(group: 'io.github.llamalad7', name: 'mixinextras-forge', version: '[0.5.0,0.6)') {
        jarJar.pin(it, '0.5.0')
    }
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.0"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.0"
    
    // TacZ dependency
    implementation fg.deobf("local:tacz-1.20.1:${tacz_version}")
    
    // FirstAid dependency
    implementation fg.deobf("local:firstaid:${firstaid_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version

    filesMatching(['META-INF/mods.toml']) {
        expand 'version': project.version
    }
}

jar {
    destinationDirectory = layout.projectDirectory.dir('.cache/intermediate')
    manifest {
        attributes([
            'Specification-Title': project.mod_id,
            'Specification-Vendor': 'Ranazy',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Ranazy',
            'MixinConfigs': 'tacz_firstaid_compat.mixins.json'
        ])
    }
    
    finalizedBy 'reobfJar'
}

tasks.named('jarJar') {
    archiveClassifier = ''
    manifest.from(tasks.jar.manifest)
    finalizedBy 'reobfJarJar'
}

reobf { jarJar {} }
